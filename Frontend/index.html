<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslatePro - Online Translator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        primary: '#4f46e5',
                        primaryHover: '#4338ca'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-sky-100 dark:from-slate-900 dark:via-slate-900 dark:to-indigo-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden transition-colors duration-300">

    <!-- Decorative background elements -->
    <div class="absolute top-[-10%] left-[-5%] w-96 h-96 bg-purple-300 dark:bg-purple-900/40 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob transition-colors duration-300"></div>
    <div class="absolute top-[20%] right-[-5%] w-96 h-96 bg-indigo-300 dark:bg-indigo-900/40 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000 transition-colors duration-300"></div>
    <div class="absolute bottom-[-10%] left-[20%] w-96 h-96 bg-sky-300 dark:bg-sky-900/40 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000 transition-colors duration-300"></div>

    <!-- Navigation -->
    <header class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-md border-b border-white/50 dark:border-slate-800 px-8 py-5 flex items-center justify-between shadow-sm relative z-10 transition-colors duration-300">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 text-white rounded-xl flex items-center justify-center font-bold shadow-lg shadow-indigo-200 dark:shadow-none text-xl">
                <i class="fa-solid fa-language"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800 dark:text-white tracking-tight">Translate<span class="text-primary dark:text-indigo-400">Pro</span></h1>

        </div>
        
        <button onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode" class="text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-300 text-xl p-3 rounded-xl flex items-center justify-center">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Main content -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8 relative z-10">
        <div class="w-full max-w-6xl bg-white/60 dark:bg-slate-800/60 backdrop-blur-2xl rounded-[2rem] shadow-2xl shadow-indigo-900/10 dark:shadow-black/40 overflow-hidden border border-white/80 dark:border-slate-700 transition-colors duration-300">
            
            <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-indigo-100/50 dark:divide-slate-700/50">
                
                <!-- Source text panel -->
                <div class="p-8 sm:p-10 flex flex-col h-full bg-white/40 dark:bg-slate-800/40 transition-colors duration-300">
                    <div class="flex justify-between items-center mb-6">
                       <select id="sourceLang" aria-label="Source language" class="bg-transparent text-slate-800 dark:text-slate-200 font-semibold text-lg focus:outline-none focus:ring-0 cursor-pointer p-1">
    <option value="az" class="dark:bg-slate-800">Azerbaijani</option>
    <option value="en" class="dark:bg-slate-800">English</option>
    <option value="tr" class="dark:bg-slate-800">Turkish</option>
    <option value="ru" class="dark:bg-slate-800">Russian</option>
    <option value="de" class="dark:bg-slate-800">German</option>
    <option value="fr" class="dark:bg-slate-800">French</option>
    <option value="es" class="dark:bg-slate-800">Spanish</option>
    <option value="it" class="dark:bg-slate-800">Italian</option>
    <option value="ar" class="dark:bg-slate-800">Arabic</option>
    <option value="zh-CN" class="dark:bg-slate-800">Chinese</option>
    <option value="ja" class="dark:bg-slate-800">Japanese</option>
    <option value="ko" class="dark:bg-slate-800">Korean</option>
</select>
                        <button onclick="clearText()" class="text-slate-400 dark:text-slate-500 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 hover:scale-110 transition-all duration-300 text-xl p-3 rounded-xl flex items-center justify-center" title="Clear text" aria-label="Clear text">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    
                    <textarea id="inputText" spellcheck="true" class="w-full flex-grow min-h-[300px] bg-white/50 dark:bg-slate-900/50 border border-slate-200/60 dark:border-slate-700 rounded-2xl p-6 text-slate-700 dark:text-slate-200 text-xl focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all resize-none placeholder-slate-400 dark:placeholder-slate-500 shadow-inner dark:shadow-black/20" placeholder="Enter the text you want to translate..."></textarea>
                    
                    <div class="mt-6 flex justify-end">
                        <button id="translateBtn" onclick="translateText()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-3.5 px-8 rounded-xl transition-all hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-indigo-300 dark:shadow-none flex items-center space-x-3 text-lg">
                            <span>Translate</span>
                            <i class="fa-solid fa-sparkles text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Translated text panel -->
                <div class="p-8 sm:p-10 flex flex-col h-full bg-indigo-50/20 dark:bg-slate-900/20 transition-colors duration-300">
                    <div class="flex justify-between items-center mb-6">
                        <select id="targetLang" aria-label="Target language" class="bg-transparent text-slate-800 dark:text-slate-200 font-semibold text-lg focus:outline-none focus:ring-0 cursor-pointer p-1">
    
    <option value="en" class="dark:bg-slate-800">English</option>
                            <option value="az" class="dark:bg-slate-800">Azerbaijani</option>
    <option value="tr" class="dark:bg-slate-800">Turkish</option>
    <option value="ru" class="dark:bg-slate-800">Russian</option>
    <option value="de" class="dark:bg-slate-800">German</option>
    <option value="fr" class="dark:bg-slate-800">French</option>
    <option value="es" class="dark:bg-slate-800">Spanish</option>
    <option value="it" class="dark:bg-slate-800">Italian</option>
    <option value="ar" class="dark:bg-slate-800">Arabic</option>
    <option value="zh-CN" class="dark:bg-slate-800">Chinese</option>
    <option value="ja" class="dark:bg-slate-800">Japanese</option>
    <option value="ko" class="dark:bg-slate-800">Korean</option>
</select>
                        
                        <div class="flex space-x-2">
                            <button onclick="copyText()" class="text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/30 hover:scale-110 transition-all duration-300 text-2xl p-3 rounded-xl flex items-center justify-center" title="Copy translation" aria-label="Copy translation">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                            <button onclick="speakText()" class="text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/30 hover:scale-110 transition-all duration-300 text-2xl p-3 rounded-xl flex items-center justify-center" title="Listen to translation" aria-label="Listen to translation">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="relative w-full flex-grow min-h-[300px]">
                        <textarea id="outputText" readonly class="w-full h-full bg-transparent border-none rounded-2xl p-6 text-slate-800 dark:text-slate-200 text-xl font-medium focus:outline-none resize-none leading-relaxed placeholder-slate-400 dark:placeholder-slate-500" placeholder="Your translation will appear here..."></textarea>
                        
                        <!-- Loading indicator -->
                        <div id="loading" class="absolute inset-0 bg-white/40 dark:bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center rounded-2xl transition-all">
                            <div class="flex flex-col items-center">
                                <i class="fa-solid fa-circle-notch fa-spin text-5xl text-indigo-600 dark:text-indigo-400 mb-4"></i>
                                <span class="text-indigo-800 dark:text-indigo-300 font-medium">Translating...</span>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
